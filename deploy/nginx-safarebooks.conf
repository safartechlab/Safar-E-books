# Nginx = the "front door" of the server. It receives visitors on port 80/443
# and passes everything to the Node app running on port 5000.
#
# Install:  sudo cp deploy/nginx-safarebooks.conf /etc/nginx/sites-available/safarebooks
#           sudo ln -s /etc/nginx/sites-available/safarebooks /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then get the free HTTPS certificate (certbot adds the 443 block for you):
#           sudo certbot --nginx -d safarebooks.com -d www.safarebooks.com

server {
    listen 80;
    listen [::]:80;
    server_name safarebooks.com www.safarebooks.com;

    # Admin uploads are limited to 10 MB per file by the app; leave a little room.
    client_max_body_size 12m;

    # Make text files smaller on the wire (the Node app does not compress).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
